version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Wait a week before proposing a newly published version: most malicious or broken
    # releases are caught and pulled within days.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    # Packages that must move together go in one PR. Bumped one at a time they fail to
    # install: react-dom requires the matching react, and vitest and the React plugin each
    # require a specific vite major. The first group a package matches wins, so these come
    # before the catch-all. Security updates need their own groups (`applies-to`).
    groups:
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      vite-toolchain:
        patterns: ['vite', 'vitest', '@vitest/*', '@vitejs/*']
      react-security:
        applies-to: security-updates
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      vite-toolchain-security:
        applies-to: security-updates
        patterns: ['vite', 'vitest', '@vitest/*', '@vitejs/*']
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
