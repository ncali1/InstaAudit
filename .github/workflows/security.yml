name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v7

      - run: semgrep scan --config p/default --config p/typescript --config p/react --error --metrics off

  dependencies:
    name: Dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Blocks on high/critical advisories in anything that ships to users.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      # Blocks a PR that adds a dependency with a known high/critical advisory.
      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

      # Everything in this project is a devDependency (the site is fully bundled), so the
      # full audit is reported in the job summary rather than gating: build-tool advisories
      # are handled through Dependabot PRs.
      - name: Report full audit (not gating)
        if: always()
        run: |
          {
            echo '### npm audit (all dependencies, informational)'
            echo '```'
            npm audit || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
